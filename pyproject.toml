[project]
name = "customer-enquiry-triage"
version = "0.1.0"
description = "AI-powered customer enquiry classification service for IBM MQ and SQL Server workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "environs>=15.1.0",
    "ibmmq>=2.1.0",
    "jsonschema>=4.23.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "types-jsonschema>=4.26.0.20260518",
]

[project.scripts]
customer-enquiry-triage = "src:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
