[project]
name = "util.publish.mq"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ibmmq>=2.1.0",
    "jsonschema>=4.23.0",
]

[project.scripts]
"util.publish.mq" = "main:main"

[tool.setuptools]
py-modules = ["main"]
package-dir = {"" = "src"}

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
