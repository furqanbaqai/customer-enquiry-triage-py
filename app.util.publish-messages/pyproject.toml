[project]
name = "util.publish.mq"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "environs>=15.2.0",
    "ibmmq>=2.1.0",
    "jsonschema>=4.23.0",
]

[project.scripts]
"util.publish.mq" = "main:main"

[tool.setuptools]
py-modules = ["main"]
package-dir = {"" = "src"}

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
